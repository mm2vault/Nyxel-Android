<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<style>
:root {
  --bg: #0B0612;
  --bg-top: #1A0B2E;
  --capsule: #000000;
  --purple: #8B5CF6;
  --deep: #5B21B6;
  --pink: #F472B6;
  --pink-soft: #FF9CD0;
  --visor-top: #1E0F33;
  --visor-bottom: #0A0412;
  --eye: #FFE4F2;
  --fg: #FFFFFF;
  --muted: rgba(255, 255, 255, 0.62);
  --faint: rgba(255, 255, 255, 0.4);
  --font: 'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}

html, body { height: 100%; }

body {
  box-sizing: border-box;
  margin: 0;
  display: flex;
  flex-direction: column;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-color: var(--bg);
  background-image: linear-gradient(180deg, var(--bg-top), var(--bg) 70%);
  color: var(--fg);
  font-family: var(--font);
  overflow-x: hidden;
}

.island {
  position: relative;
  flex: none;
  box-sizing: border-box;
  width: 130px;
  height: 38px;
  margin: 0 auto;
  border-radius: 22px;
  background: var(--capsule);
  overflow: hidden;
  box-shadow: 0 0 14px rgba(139, 92, 246, 0.3), 0 4px 20px rgba(244, 114, 182, 0.15);
  animation: breathe 3s ease-in-out infinite alternate;
  transition:
    width 0.5s cubic-bezier(0.34, 1.2, 0.64, 1),
    height 0.5s cubic-bezier(0.34, 1.2, 0.64, 1),
    border-radius 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
}

.island[data-open="true"] {
  width: min(100%, 360px);
  height: 270px;
  border-radius: 42px;
  animation-name: breathe-open;
}

/* The whole capsule is one big tap target; the player controls sit above it. */
.tap {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tap:focus-visible { outline: 2px solid var(--pink); outline-offset: -4px; border-radius: inherit; }

@keyframes breathe {
  from { box-shadow: 0 0 14px rgba(139, 92, 246, 0.25), 0 4px 20px rgba(244, 114, 182, 0.15); }
  to   { box-shadow: 0 0 14px rgba(139, 92, 246, 0.5),  0 4px 20px rgba(244, 114, 182, 0.3); }
}

@keyframes breathe-open {
  from { box-shadow: 0 0 28px rgba(139, 92, 246, 0.25), 0 4px 40px rgba(244, 114, 182, 0.15); }
  to   { box-shadow: 0 0 28px rgba(139, 92, 246, 0.5),  0 4px 40px rgba(244, 114, 182, 0.3); }
}

.layer {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.closed { justify-content: space-between; padding: 0 16px; opacity: 1; }

.open {
  z-index: 2;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
  gap: 14px;
  padding: 22px 24px 20px;
  opacity: 0;
  background: radial-gradient(150px 110px at 26% 24%, rgba(139, 92, 246, 0.3), transparent 70%);
}

.island[data-open="true"] .closed { opacity: 0; }
.island[data-open="true"] .open { opacity: 1; }

.top {
  display: flex;
  align-items: center;
  gap: 34px;
  padding-left: 18px;
}

/* Nyxel: glossy head, glass visor, glowing eyes. Every size derives from --s. */
.nyxel {
  --blink: 1;
  position: relative;
  flex: none;
  width: var(--s);
  height: calc(var(--s) * 0.9);
  border-radius: 46%;
  background: radial-gradient(circle at 30% 20%, var(--pink-soft) 0%, var(--pink) 16%, var(--purple) 56%, var(--deep) 100%);
  box-shadow:
    0 0 calc(var(--s) * 0.4) rgba(139, 92, 246, 0.55),
    inset 0 calc(var(--s) * -0.1) calc(var(--s) * 0.16) rgba(30, 0, 70, 0.5),
    inset 0 calc(var(--s) * 0.035) calc(var(--s) * 0.06) rgba(255, 255, 255, 0.4),
    inset calc(var(--s) * -0.04) calc(var(--s) * -0.05) calc(var(--s) * 0.08) rgba(244, 114, 182, 0.35);
  rotate: var(--tilt, 0deg);
  transition: rotate 0.35s ease-out;
  animation: bob 3.4s ease-in-out infinite alternate;
}

@keyframes bob {
  from { transform: translateY(0); }
  to   { transform: translateY(calc(var(--s) * -0.035)); }
}

/* Dancing to the beat while music plays. */
.nyxel.grooving { animation: groove var(--beat, 1.6s) ease-in-out infinite; }

@keyframes groove {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  50%      { transform: translateY(calc(var(--s) * -0.05)) rotate(5deg); }
}

.nyxel::before {
  content: "";
  position: absolute;
  left: 14%;
  top: 5%;
  width: 44%;
  height: 20%;
  border-radius: 50%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0));
  transform: rotate(-16deg);
  pointer-events: none;
}

.visor {
  position: absolute;
  left: 12%;
  right: 12%;
  top: 25%;
  height: 43%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(var(--s) * 0.14);
  border-radius: 999px;
  background: linear-gradient(180deg, var(--visor-top), var(--visor-bottom));
  box-shadow:
    0 0 0 calc(var(--s) * 0.012) rgba(244, 114, 182, 0.28),
    inset 0 0 calc(var(--s) * 0.1) rgba(139, 92, 246, 0.6);
  overflow: hidden;
  transform: translate(calc(var(--ex, 0px) * 0.5), calc(var(--ey, 0px) * 0.5));
  transition: transform 0.22s ease-out;
}

.visor::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.14) 26%, transparent 27%);
  pointer-events: none;
}

.eye {
  position: relative;
  box-sizing: border-box;
  width: calc(var(--s) * 0.13);
  height: calc(var(--s) * 0.2);
  border: 0 solid var(--eye);
  border-radius: 999px;
  background: linear-gradient(180deg, var(--eye) 0%, #F9A8D4 65%, var(--pink) 100%);
  box-shadow: 0 0 calc(var(--s) * 0.12) var(--pink), 0 0 calc(var(--s) * 0.03) rgba(255, 255, 255, 0.8);
  transform: translate(var(--ex, 0px), var(--ey, 0px)) scaleY(var(--blink));
  transition: transform 0.14s ease-out, height 0.25s ease, width 0.25s ease, border-radius 0.25s ease;
}

.eye::after {
  content: "";
  position: absolute;
  left: 20%;
  top: 12%;
  width: 36%;
  height: 26%;
  border-radius: 50%;
  background: #fff;
  opacity: 0.95;
}

.nyxel.blink { --blink: 0.1; }

.nyxel[data-mood="happy"] .eye {
  height: calc(var(--s) * 0.1);
  width: calc(var(--s) * 0.15);
  border-width: calc(var(--s) * 0.035);
  border-bottom-width: 0;
  border-radius: 999px 999px 0 0;
  background: none;
  box-shadow: 0 0 calc(var(--s) * 0.08) var(--pink);
}
.nyxel[data-mood="happy"] .eye::after { opacity: 0; }

.nyxel[data-mood="sleepy"] .eye {
  height: calc(var(--s) * 0.06);
  width: calc(var(--s) * 0.15);
  border-radius: 0 0 999px 999px;
  opacity: 0.75;
}
.nyxel[data-mood="sleepy"] .eye::after { opacity: 0; }

.cheek {
  position: absolute;
  bottom: 21%;
  width: calc(var(--s) * 0.13);
  height: calc(var(--s) * 0.075);
  border-radius: 50%;
  background: var(--pink-soft);
  opacity: 0.18;
  filter: blur(calc(var(--s) * 0.015));
  transition: opacity 0.3s ease;
}
.cheek.l { left: 11%; }
.cheek.r { right: 11%; }
.nyxel[data-mood="happy"] .cheek { opacity: 0.75; }

.mouth {
  position: absolute;
  left: 50%;
  bottom: 12%;
  box-sizing: border-box;
  width: calc(var(--s) * 0.12);
  height: calc(var(--s) * 0.05);
  border: 2px solid rgba(255, 255, 255, 0.8);
  border-top: 0;
  border-radius: 0 0 999px 999px;
  transform: translateX(-50%);
  transition: width 0.25s ease, height 0.25s ease, border-radius 0.25s ease, opacity 0.25s ease;
}
.nyxel[data-mood="happy"] .mouth { width: calc(var(--s) * 0.2); height: calc(var(--s) * 0.09); }
.nyxel[data-mood="sleepy"] .mouth {
  width: calc(var(--s) * 0.07);
  height: calc(var(--s) * 0.07);
  border-top: 2px solid rgba(255, 255, 255, 0.8);
  border-radius: 50%;
  opacity: 0.6;
}

.ear {
  position: absolute;
  top: 38%;
  width: calc(var(--s) * 0.08);
  height: calc(var(--s) * 0.22);
  border-radius: 999px;
  background: linear-gradient(180deg, var(--purple), var(--deep));
  box-shadow: 0 0 calc(var(--s) * 0.08) rgba(244, 114, 182, 0.55);
  transition: width 0.25s ease, height 0.25s ease, top 0.25s ease;
}
.ear.l { left: calc(var(--s) * -0.04); }
.ear.r { right: calc(var(--s) * -0.04); }

/* Headphones appear while music plays. */
.band {
  position: absolute;
  left: 7%;
  right: 7%;
  top: -8%;
  height: 52%;
  box-sizing: border-box;
  border: calc(var(--s) * 0.04) solid var(--pink);
  border-bottom: 0;
  border-radius: 999px 999px 0 0;
  box-shadow: 0 0 calc(var(--s) * 0.08) rgba(244, 114, 182, 0.6);
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}
.nyxel.grooving .band { opacity: 1; }
.nyxel.grooving .ear {
  top: 31%;
  width: calc(var(--s) * 0.14);
  height: calc(var(--s) * 0.28);
  background: linear-gradient(180deg, var(--pink), var(--purple));
}
.nyxel.grooving .ear.l { left: calc(var(--s) * -0.07); }
.nyxel.grooving .ear.r { right: calc(var(--s) * -0.07); }

.antenna {
  position: absolute;
  left: 50%;
  top: calc(var(--s) * -0.13);
  width: 3px;
  height: calc(var(--s) * 0.15);
  margin-left: -1.5px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--pink), var(--purple));
}
.antenna::after {
  content: "";
  position: absolute;
  left: 50%;
  top: -5px;
  width: 9px;
  height: 9px;
  margin-left: -4.5px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, var(--pink) 60%);
  box-shadow: 0 0 10px var(--pink);
  animation: pulse 2.2s ease-in-out infinite;
}
.nyxel[data-mood="happy"] .antenna::after { animation-duration: 0.7s; }
.nyxel[data-mood="sleepy"] .antenna::after { animation: none; opacity: 0.35; box-shadow: none; }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 6px var(--pink); transform: scale(1); }
  50%      { box-shadow: 0 0 14px var(--pink); transform: scale(1.12); }
}

.spark {
  position: absolute;
  width: 7px;
  height: 7px;
  background: #fff;
  clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  filter: drop-shadow(0 0 3px var(--pink));
  animation: twinkle 2.6s ease-in-out infinite;
}
.spark.a { top: 2%; right: -16%; }
.spark.b { bottom: 14%; left: -18%; width: 5px; height: 5px; animation-delay: 1.1s; }
.nyxel[data-mood="sleepy"] .spark { display: none; }

@keyframes twinkle {
  0%, 100% { opacity: 0.15; transform: scale(0.6); }
  50%      { opacity: 1; transform: scale(1); }
}

.zzz {
  position: absolute;
  right: -12%;
  top: -4%;
  font-size: calc(var(--s) * 0.2);
  font-weight: 700;
  color: var(--pink-soft);
  opacity: 0;
  pointer-events: none;
}
.nyxel[data-mood="sleepy"] .zzz { animation: zfloat 2.4s ease-in-out infinite; }

@keyframes zfloat {
  0%   { opacity: 0; transform: translate(0, 6px); }
  40%  { opacity: 0.9; }
  100% { opacity: 0; transform: translate(6px, -10px); }
}

.hand {
  position: absolute;
  bottom: calc(var(--s) * -0.04);
  width: calc(var(--s) * 0.2);
  height: calc(var(--s) * 0.24);
  border-radius: 50% 50% 46% 46%;
  background: radial-gradient(circle at 35% 25%, var(--pink-soft), var(--purple) 60%, var(--deep));
  box-shadow:
    0 0 calc(var(--s) * 0.1) rgba(139, 92, 246, 0.5),
    inset 0 calc(var(--s) * -0.03) calc(var(--s) * 0.05) rgba(30, 0, 70, 0.45);
  transform-origin: 50% 90%;
  transition: transform 0.4s ease;
}
.hand::before {
  content: "";
  position: absolute;
  top: 34%;
  width: 42%;
  height: 34%;
  border-radius: 50%;
  background: inherit;
}
.hand.l { left: calc(var(--s) * -0.26); transform: rotate(8deg); }
.hand.l::before { left: 80%; }
.hand.r { right: calc(var(--s) * -0.26); transform: rotate(-8deg); }
.hand.r::before { right: 80%; }

.nyxel.small .hand { width: calc(var(--s) * 0.27); height: calc(var(--s) * 0.32); }
.nyxel.small .hand.l { left: calc(var(--s) * -0.34); }
.nyxel.small .hand.r { right: calc(var(--s) * -0.34); }

.nyxel.waving .hand.r { animation: wave 2.6s ease-in-out; }

@keyframes wave {
  0%   { transform: translate(0, 0) rotate(-8deg); }
  12%  { transform: translate(calc(var(--s) * 0.04), calc(var(--s) * var(--lift, 0.3) * -1)) rotate(0deg); }
  26%  { transform: translate(calc(var(--s) * 0.04), calc(var(--s) * var(--lift, 0.3) * -1)) rotate(22deg); }
  40%  { transform: translate(calc(var(--s) * 0.04), calc(var(--s) * var(--lift, 0.3) * -1)) rotate(-16deg); }
  54%  { transform: translate(calc(var(--s) * 0.04), calc(var(--s) * var(--lift, 0.3) * -1)) rotate(22deg); }
  68%  { transform: translate(calc(var(--s) * 0.04), calc(var(--s) * var(--lift, 0.3) * -1)) rotate(-16deg); }
  82%  { transform: translate(calc(var(--s) * 0.04), calc(var(--s) * var(--lift, 0.3) * -1)) rotate(6deg); }
  100% { transform: translate(0, 0) rotate(-8deg); }
}

.floor {
  position: absolute;
  left: 16%;
  right: 16%;
  bottom: calc(var(--s) * -0.2);
  height: calc(var(--s) * 0.09);
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.5), transparent 70%);
  animation: floor 3.4s ease-in-out infinite alternate;
}

@keyframes floor {
  from { transform: scaleX(1); opacity: 0.9; }
  to   { transform: scaleX(0.86); opacity: 0.55; }
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  padding: 3px 10px 3px 8px;
  border-radius: 999px;
  background: rgba(139, 92, 246, 0.2);
  color: #DCCBFF;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.chip i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--pink);
  box-shadow: 0 0 6px var(--pink);
}

.dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--pink);
  box-shadow: 0 0 6px rgba(244, 114, 182, 0.7);
}

/* Mini equalizer replaces the dot in the closed capsule while music plays. */
.eq {
  display: none;
  flex: none;
  align-items: flex-end;
  gap: 2px;
  height: 14px;
}
.eq i {
  display: block;
  width: 3px;
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--pink), var(--purple));
  transform-origin: bottom;
  animation: eqbar 0.9s ease-in-out infinite alternate;
}
.eq i:nth-child(2) { animation-duration: 0.7s; animation-delay: 0.15s; }
.eq i:nth-child(3) { animation-duration: 1.1s; animation-delay: 0.3s; }
.island[data-playing="true"] .dot { display: none; }
.island[data-playing="true"] .eq { display: flex; }

@keyframes eqbar {
  from { transform: scaleY(0.25); }
  to   { transform: scaleY(1); }
}

.who { min-width: 0; }
.name { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.2; }
.status { margin: 4px 0 0; font-size: 14px; color: var(--muted); }

/* Player */
.player { pointer-events: auto; display: grid; gap: 10px; }

.track {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
}
.title {
  min-width: 0;
  overflow: hidden;
  font-size: 15px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.artist { flex: none; font-size: 12px; color: var(--muted); }

.bar {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.rail {
  flex: 1;
  height: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  overflow: hidden;
}
.rail i {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--purple), var(--pink));
}

.ctrl { display: flex; align-items: center; justify-content: center; gap: 18px; }

.btn {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s ease;
}
.btn.main {
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  box-shadow: 0 0 18px rgba(244, 114, 182, 0.45);
}
.btn:active { transform: scale(0.92); }
.btn:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }


html,body{width:100%;height:100%;min-height:0;margin:0!important;padding:0!important;display:block!important;overflow:hidden!important;background:transparent!important;background-color:transparent!important;background-image:none!important;box-shadow:none!important}
body{box-sizing:border-box!important;color:var(--fg);font-family:var(--font)}
.island{margin:0 auto!important;max-width:100%!important}
</style>
</head>
<body>
<div class="island" id="island" data-open="false" data-playing="false">
  <button class="tap" id="tap" type="button" aria-expanded="false" aria-label="Nyxel kapsülünü aç veya kapat"></button>

  <div class="layer closed">
    <span class="nyxel small" data-mood="idle" style="--s:26px; --lift:0.55">
      <span class="hand l"></span><span class="hand r"></span>
      <span class="visor"><span class="eye"></span><span class="eye"></span></span>
    </span>
    <span class="dot"></span>
    <span class="eq"><i></i><i></i><i></i></span>
  </div>

  <div class="layer open">
    <div class="top">
      <span class="nyxel" data-mood="idle" style="--s:96px">
        <span class="floor"></span>
        <span class="band"></span>
        <span class="antenna"></span>
        <span class="ear l"></span><span class="ear r"></span>
        <span class="hand l"></span><span class="hand r"></span>
        <span class="visor"><span class="eye"></span><span class="eye"></span></span>
        <span class="cheek l"></span><span class="cheek r"></span>
        <span class="mouth"></span>
        <span class="spark a"></span><span class="spark b"></span>
        <span class="zzz">z</span>
      </span>
      <div class="who">
        <p class="name">Nyxel</p>
        <p class="status" id="status">Seni dinliyorum...</p>
        <span class="chip"><i></i><span id="chip">Sakin</span></span>
      </div>
    </div>

    <div class="player">
      <div class="track">
        <span class="title" id="title">Mor Gece</span>
        <span class="artist" id="artist">Nyxel · Lo-Fi</span>
      </div>
      <div class="bar">
        <span id="cur">0:00</span>
        <div class="rail"><i id="fill"></i></div>
        <span id="dur">1:36</span>
      </div>
      <div class="ctrl">
        <button class="btn" id="prevBtn" type="button" aria-label="Önceki şarkı">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg>
        </button>
        <button class="btn main" id="playBtn" type="button" aria-label="Çal">
          <svg id="iPlay" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <svg id="iPause" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
        </button>
        <button class="btn" id="nextBtn" type="button" aria-label="Sonraki şarkı">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var island=document.getElementById('island');
  var tap=document.getElementById('tap');
  var faces=[].slice.call(document.querySelectorAll('.nyxel'));
  var status=document.getElementById('status');
  var chip=document.getElementById('chip');
  var target=null,lastMove=0,open=false,playing=false,waving=false;
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var sleepTimer=null,moodTimer=null;
  function mood(){return faces[0].getAttribute('data-mood')||'idle'}
  function look(){
    faces.forEach(function(face){
      var size=face.offsetWidth,ox=0,oy=0,tilt=0;
      if(mood()==='sleepy'){oy=size*.02;tilt=7}
      else if(target){
        var rect=face.getBoundingClientRect();
        var dx=target.x-(rect.left+rect.width/2);
        var dy=target.y-(rect.top+rect.height/2);
        var distance=Math.sqrt(dx*dx+dy*dy)||1;
        var strength=Math.min(1,distance/140);
        ox=dx/distance*strength*size*.07;
        oy=dy/distance*strength*size*.045;
        tilt=dx/distance*strength*5;
      }
      face.style.setProperty('--ex',ox.toFixed(1)+'px');
      face.style.setProperty('--ey',oy.toFixed(1)+'px');
      face.style.setProperty('--tilt',tilt.toFixed(1)+'deg');
    });
  }
  function setMood(value,message){
    faces.forEach(function(face){face.setAttribute('data-mood',value)});
    if(message&&status)status.textContent=message;
    if(chip)chip.textContent=playing?'Müzikte':({idle:'Sakin',happy:'Mutlu',sleepy:'Uykulu'}[value]||'Sakin');
    look();
  }
  function rest(){
    clearTimeout(sleepTimer);
    sleepTimer=setTimeout(function(){
      if(open&&!playing)setMood('sleepy','Biraz uykum geldi...');
    },12000);
  }
  function wave(message){
    if(waving||playing||mood()==='sleepy')return;
    waving=true;
    faces.forEach(function(face){face.classList.add('waving')});
    setMood('happy',message);
    setTimeout(function(){
      faces.forEach(function(face){face.classList.remove('waving')});
      waving=false;
      if(mood()==='happy'&&!playing)setMood('idle',open?'Seni dinliyorum...':undefined);
    },2700);
  }
  function greet(){
    if(playing){setMood('happy','Şimdi çalıyor');return}
    setMood('happy','Merhaba! Seni bekliyordum.');
    clearTimeout(moodTimer);
    moodTimer=setTimeout(function(){wave('Merhaba! Seni bekliyordum.')},450);
    rest();
  }
  function onPoint(event){
    target={x:event.clientX,y:event.clientY};
    lastMove=Date.now();
    if(open){if(mood()==='sleepy')greet();else rest()}
    look();
  }
  window.addEventListener('pointermove',onPoint,{passive:true});
  window.addEventListener('pointerdown',onPoint,{passive:true});
  tap.addEventListener('click',function(){
    open=!open;
    island.setAttribute('data-open',open?'true':'false');
    tap.setAttribute('aria-expanded',open?'true':'false');
    if(open){greet()}else{
      clearTimeout(moodTimer);clearTimeout(sleepTimer);
      if(!playing)setMood('idle','Seni dinliyorum...');
    }
    if(window.NyxelOverlay)window.NyxelOverlay.setExpanded(open);
  });
  function intercept(id,action){
    var button=document.getElementById(id);
    if(!button)return;
    button.addEventListener('click',function(event){
      event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
      if(window.NyxelOverlay)window.NyxelOverlay[action]();
    },true);
  }
  intercept('playBtn','togglePlayback');
  intercept('prevBtn','previous');
  intercept('nextBtn','next');
  var rail=document.querySelector('.player .rail');
  if(rail)rail.addEventListener('click',function(event){
    var rect=rail.getBoundingClientRect();
    var ratio=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width));
    if(window.NyxelOverlay)window.NyxelOverlay.seekTo(ratio);
  });
  window.nyxelNativeRender=function(data){
    data=data||{};
    function setText(id,value){var element=document.getElementById(id);if(element&&value!=null)element.textContent=value}
    setText('title',data.title||'Nyxel');
    setText('artist',data.artist||'Müzik hazır');
    setText('status',data.status||(data.playing?'Şimdi çalıyor':'Seni dinliyorum...'));
    setText('chip',data.playing?'Müzikte':'Sakin');
    setText('cur',data.position||'0:00');
    setText('dur',data.duration||'0:00');
    var fill=document.getElementById('fill');
    if(fill)fill.style.width=(data.progress||0)+'%';
    playing=!!data.playing;
    island.setAttribute('data-playing',playing?'true':'false');
    var play=document.getElementById('iPlay'),pause=document.getElementById('iPause');
    if(play)play.hidden=playing;if(pause)pause.hidden=!playing;
    faces.forEach(function(face){
      face.classList.toggle('grooving',playing);
      face.setAttribute('data-mood',playing?'happy':'idle');
    });
    if(chip)chip.textContent=playing?'Müzikte':'Sakin';
  };
  setInterval(function(){
    if(target&&Date.now()-lastMove>3000)target=null;
    look();
  },120);
  function blink(){
    faces.forEach(function(face){face.classList.add('blink')});
    setTimeout(function(){faces.forEach(function(face){face.classList.remove('blink')})},140);
    setTimeout(blink,2400+Math.random()*3200);
  }
  if(!reduced){setTimeout(blink,1800);setTimeout(function(){wave('Hey, buradayım!')},1500)}
  look();
})();
</script>
</body>
</html>
