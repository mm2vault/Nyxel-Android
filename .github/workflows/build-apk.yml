name: Build and Publish Nyxel APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: nyxel-main-release
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign and publish Nyxel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure and verify Nyxel signing key
        shell: bash
        env:
          NYXEL_KEYSTORE_BASE64: ${{ secrets.NYXEL_KEYSTORE_BASE64 }}
          NYXEL_KEYSTORE_PASSWORD: ${{ secrets.NYXEL_KEYSTORE_PASSWORD }}
          NYXEL_KEY_ALIAS: ${{ secrets.NYXEL_KEY_ALIAS }}
          NYXEL_KEY_PASSWORD: ${{ secrets.NYXEL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${NYXEL_KEYSTORE_BASE64:?Missing NYXEL_KEYSTORE_BASE64 repository secret}"
          : "${NYXEL_KEYSTORE_PASSWORD:?Missing NYXEL_KEYSTORE_PASSWORD repository secret}"
          : "${NYXEL_KEY_ALIAS:?Missing NYXEL_KEY_ALIAS repository secret}"
          : "${NYXEL_KEY_PASSWORD:?Missing NYXEL_KEY_PASSWORD repository secret}"
          KEYSTORE="$RUNNER_TEMP/nyxel-release.keystore"
          printf '%s' "$NYXEL_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$NYXEL_KEYSTORE_PASSWORD" -alias "$NYXEL_KEY_ALIAS" -keypass "$NYXEL_KEY_PASSWORD" >/dev/null
          echo "NYXEL_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "NYXEL_KEYSTORE_PASSWORD=$NYXEL_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NYXEL_KEY_ALIAS=$NYXEL_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NYXEL_KEY_PASSWORD=$NYXEL_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          VERSION_NAME="2.1.${GITHUB_RUN_NUMBER}"
          VERSION_CODE="$((1000 + GITHUB_RUN_NUMBER))"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: |
          gradle --no-daemon clean assembleRelease \
            -PnyxelVersionName="${{ steps.version.outputs.name }}" \
            -PnyxelVersionCode="${{ steps.version.outputs.code }}"

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload direct APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nyxel-${{ steps.version.outputs.name }}-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK directly to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Nyxel.apk"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Nyxel ${{ steps.version.outputs.name }}

          Direct Android APK download: **Nyxel.apk**

          NYXEL_VERSION_CODE=${{ steps.version.outputs.code }}

          Built from commit $GITHUB_SHA.
          EOF
          gh release create "${{ steps.version.outputs.tag }}" \
            "$RUNNER_TEMP/Nyxel.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nyxel ${{ steps.version.outputs.name }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
